# ─────────────────────────────────────────────────────────────────────────────
# ft_transcendence log pipeline (Devops "log management" major module)
#
# Logstash does the collecting itself -- the subject names Elasticsearch,
# Logstash and Kibana, so no fourth agent (Filebeat) is introduced. Two inputs
# cover everything the stack produces:
#
#   gelf : every containerised service's stdout/stderr, shipped by Docker's own
#          gelf log driver. Covers nginx too, whose access.log and error.log are
#          symlinks to /dev/stdout and /dev/stderr in the OWASP base image.
#   file : ModSecurity's audit log, a real file on a shared volume and the one
#          thing the gelf driver cannot see.
# ─────────────────────────────────────────────────────────────────────────────

input {
  gelf {
    id       => "docker_gelf"
    host     => "0.0.0.0"
    port     => 12201
    use_udp  => true
    use_tcp  => false
  }

  file {
    id            => "modsecurity_audit"
    path          => "/var/log/modsecurity/audit.log"
    # Read the file from the top on first sight; on restart the sincedb (kept on
    # the logstash_data volume) resumes where we stopped, so events are not
    # duplicated.
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb_modsecurity"
    # ModSecurity is configured with `SecAuditLogFormat JSON`, so each line is a
    # complete JSON object -- no multiline grok needed.
    codec          => json
    tags           => ["modsecurity"]
  }
}

filter {

  # ── ModSecurity audit (file input) ─────────────────────────────────────────
  if "modsecurity" in [tags] {
    mutate { add_field => { "[@metadata][target]" => "modsecurity" } }

    # The audit record nests everything under `transaction`. Lift the fields the
    # dashboards need to the top level so they are aggregatable.
    if [transaction] {
      mutate {
        rename => {
          "[transaction][client_ip]"                 => "client_ip"
          "[transaction][request][uri]"              => "request_path"
          "[transaction][request][method]"           => "http_method"
          "[transaction][response][http_code]"       => "status"
          "[transaction][time_stamp]"                => "modsec_timestamp"
          "[transaction][messages]"                  => "modsec_messages"
          # Header name is capitalised exactly as ModSecurity records it.
          # Without this the WAF dashboard's user-agent panel is empty, since
          # the audit record keeps it nested under request.headers.
          "[transaction][request][headers][User-Agent]" => "user_agent"
        }
      }
      mutate { convert => { "status" => "integer" } }
    }

    # One document per request can carry several rule matches. Pull the rule ids
    # and severities into flat arrays so a Kibana terms aggregation works.
    if [modsec_messages] {
      ruby {
        id => "modsec_flatten_rules"
        code => '
          msgs = event.get("modsec_messages")
          if msgs.is_a?(Array)
            ids  = []
            sevs = []
            msgs.each do |m|
              d = m["details"] || {}
              ids  << d["ruleId"]   if d["ruleId"]
              sevs << d["severity"] if d["severity"]
            end
            event.set("rule_ids", ids)      unless ids.empty?
            event.set("rule_severities", sevs) unless sevs.empty?
            event.set("rule_hit_count", msgs.length)
          end
        '
      }
    }
  }

  # ── Everything arriving over gelf ──────────────────────────────────────────
  else {
    # The gelf driver maps stdout to syslog level 6 and stderr to level 3, so
    # the two streams stay distinguishable even though they share one input.
    if [level] == 3 {
      mutate { replace => { "stream" => "stderr" } }
    } else {
      mutate { replace => { "stream" => "stdout" } }
    }

    # ── nginx ────────────────────────────────────────────────────────────────
    if [container_name] == "trans_frontend_nginx" {
      mutate { add_field => { "[@metadata][target]" => "nginx" } }
      # Default; overridden to "access" below when the line really is one.
      mutate { add_field => { "log_kind" => "runtime" } }

      # Only stdout carries the access log; stderr is the error log, which has a
      # different shape and is left as free text.
      #
      # The extra `=~` guard matters: nginx's entrypoint also writes startup
      # chatter to stdout ("Configuration complete; ready for start up", the
      # ModSecurity rule-count notice, ...). Without it every one of those lines
      # gets grokked, fails, and is tagged _nginx_access_parse_failure -- which
      # buries real parse failures under noise and makes the pipeline look
      # broken. Access lines always start with the client address.
      if [stream] == "stdout" and [message] =~ /^\S+ - \S+ \[/ {
        grok {
          id            => "nginx_access"
          # Matches log_format `main` in frontend/docker_conf/nginx.conf and
          # nginx-dep.conf (identical in both).
          # Single-quoted: Logstash has config.support_escapes off by default, so
          # a double-quoted string cannot carry the literal " characters this
          # log format contains, and \\[ would be read as an escaped backslash.
          match => { "message" => '%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http_method} %{DATA:request_path} HTTP/%{NUMBER:http_version}" %{NUMBER:status:int} %{NUMBER:body_bytes:int} "%{DATA:referrer}" "%{DATA:user_agent}" "%{DATA:x_forwarded_for}"' }
          tag_on_failure => ["_nginx_access_parse_failure"]
        }
        mutate { replace => { "log_kind" => "access" } }

        # Use nginx's own timestamp rather than the moment Logstash saw the line.
        if ![tags] or "_nginx_access_parse_failure" not in [tags] {
          date {
            match  => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
            target => "@timestamp"
            remove_field => ["nginx_timestamp"]
          }
        }
      }

    # ── Django ───────────────────────────────────────────────────────────────
    } else if [container_name] == "trans_backend_django" {
      mutate { add_field => { "[@metadata][target]" => "django" } }

      # settings.py emits one JSON object per record (python-json-logger), so
      # parse it into real fields instead of grokking free text. Lines that are
      # not JSON (tracebacks, third-party libraries writing raw text) simply
      # keep their original `message`.
      json {
        id            => "django_json"
        source        => "message"
        skip_on_invalid_json => true
        tag_on_failure => ["_django_json_parse_failure"]
      }

      if [timestamp] {
        date {
          match  => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
          target => "@timestamp"
          # python-json-logger's asctime carries NO timezone, and it follows the
          # *container's* clock rather than Django's TIME_ZONE setting. Logstash
          # would otherwise silently assume UTC; stating it makes the coupling
          # explicit. The Django image sets no TZ, so it runs UTC and this is
          # correct -- if a TZ is ever added to that container, change this too
          # or every Django log lands at the wrong time (and future-dated logs
          # vanish from Kibana, whose "Last 24 hours" ends at now).
          timezone => "UTC"
          tag_on_failure => ["_django_date_parse_failure"]
        }
      }

    # ── postgres, redis, chess_engine, stockfish_ai, timeout_checker ─────────
    } else {
      mutate { add_field => { "[@metadata][target]" => "docker" } }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]

    # Least-privilege ingest user created by elk-init: it may only create and
    # write logs-* indices. Never the elastic superuser.
    user     => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"

    index    => "logs-%{[@metadata][target]}-%{+YYYY.MM.dd}"

    # Write plain daily indices, not data streams. Retention and archiving are
    # applied to logs-* by elk-init via the ILM and SLM policies in ELK/ilm/.
    data_stream     => false

    # The logs-* template is installed by elk-init and lives in the repo, so
    # Logstash must not install or manage a template of its own -- and its user
    # deliberately lacks the privilege to do so.
    manage_template => false
    ilm_enabled     => false
  }
}
