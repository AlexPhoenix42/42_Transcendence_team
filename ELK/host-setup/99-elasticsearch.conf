# Elasticsearch requires a higher mmap count than the Linux default (65530).
# Without this, the ES container exits at boot with a bootstrap check failure:
#   max virtual memory areas vm.max_map_count [65530] is too low,
#   increase to at least [262144]
#
# Install on the VM host (one-time, survives reboot):
#   sudo install -m 644 -o root -g root \
#       ELK/host-setup/99-elasticsearch.conf /etc/sysctl.d/99-elasticsearch.conf
#   sudo sysctl --system
#
# On a machine where you do NOT have root (e.g. a 42 cluster workstation),
# the alternative is to set `node.store.allow_mmap: false` in elasticsearch.yml
# and let ES fall back to niofs. That is slower and is NOT what this project
# uses -- we own this VM, so we apply the real fix.
#
# Ref: https://www.elastic.co/guide/en/elasticsearch/reference/current/vm-max-map-count.html
vm.max_map_count=262144
