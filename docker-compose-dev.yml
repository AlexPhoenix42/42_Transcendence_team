services:
  postgres:
    build:
      context:      db_server
      dockerfile:   docker_conf/Dockerfile
      target:       dev
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/postgres
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/postgres,mode=max
    container_name: trans_db_server
    restart:        unless-stopped
    environment:
      POSTGRES_USER:      ${DB_SERVER_USER}
      POSTGRES_PASSWORD:  ${DB_SERVER_PASS}
      POSTGRES_DB:        ${DB_SERVER_DB}
      FRONTEND_URL:       ${FRONTEND_URL}
    ports:
      - "${DB_PORT}:5432"   # The internal port stays hard-coded (internal confs deps)
    volumes:
      - ${HOME}/goinfre/trans_data/trans_db_server_data:/var/lib/postgresql
    networks:
      - trans_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SERVER_USER} -d ${DB_SERVER_DB}"]
      interval:     5s
      timeout:      5s
      retries:      5
      start_period: 120s

  redis:
    image:            redis:8-alpine
    container_name:   trans_redis
    restart:          unless-stopped
    networks:
      - trans_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  vault-init:
    image:          hashicorp/vault:latest
    depends_on:
      vault:
        condition:  service_healthy
    environment:
      VAULT_ADDR:   http://vault:8200
      VAULT_TOKEN:  root
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts_dev/seed_vault_dev.sh:/app/seed_vault_dev.sh:ro
    entrypoint:     ["/bin/sh", "-c"]
    command:
      - |
        /app/seed_vault_dev.sh
    restart:        "no"
    networks:
      - trans_net

  vault:
    build:
      context:      vault
      dockerfile:   docker_conf/Dockerfile
      target:       dev
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/vault
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/vault,mode=max
    container_name:             trans_vault
    restart:                    unless-stopped
    environment:
      VAULT_MODE:               dev
      VAULT_DEV_ROOT_TOKEN_ID:  root
      VAULT_ADDR:                ${VAULT_URL}
    ports:
      - "8200:8200"
    volumes:
      #- ./vault/docker_conf/config-dev.hcl:/vault/config/config.hcl:ro
      #- ./vault/data:/vault/data
      - ${HOME}/goinfre/trans_data/trans_vault_data:/vault/data
    networks:
      - trans_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 15s

  mailpit:
    image:            axllent/mailpit
    container_name:   mailpit
    restart:          unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP server
    networks:
      - trans_net

  engine-builder:
    build:
      context:      backend/chess_engine
      dockerfile:   docker_conf/Dockerfile
      target:       build
      pull:         false
    container_name: engine-builder
    volumes:
      - ./backend/chess_engine/srcs:/app/srcs:ro
      - ./backend/chess_engine/incs:/app/incs:ro
      - ./backend/chess_engine/Makefile:/app/Makefile:ro
      - ./backend/chess_engine/bin:/app/bin
    command: sh -c "make clean && make"
    networks:
      - trans_net

  chess_engine:
    build:
      context:      backend/chess_engine
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/chess_engine
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/chess_engine,mode=max
    container_name: chess_engine
    restart:        unless-stopped
    environment:
      ENGINE_PORT: 4190
    expose:
      - "4190"
    networks:
      - trans_net

  stockfish_ai:
    build:
      context:      backend/stockfish_ai
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/stockfish_ai
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/stockfish_ai,mode=max
    container_name: stockfish_ai
    restart:        unless-stopped
    environment:
      ENGINE_PORT: 4191
    expose:
      - "4191"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # NOTE(local): desactive - kernel sans CFS scheduler/cgroup cpu
    # ("NanoCPUs can not be set"). Ne pas committer (machine-local).
    #deploy:
    #  resources:
    #    limits:
    #      cpus: "1.0"
    #      memory: 512M
    networks:
      - trans_net

  backend_django:
    build:
      context:      backend/django
      dockerfile:   docker_conf/Dockerfile
      target:       dev
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/backend_django
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/backend_django,mode=max
    container_name: trans_backend_django
    restart:        unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST:      trans_db_server
      DB_PORT:      "5432"
      REDIS_HOST:   trans_redis
      REDIS_PORT:   "6379"
    ports:
      - "9000:9000"
    volumes:
      - ./backend/django:/django
    depends_on:
      postgres:
        condition:  service_healthy
      redis:
        condition:  service_healthy
      vault:
        condition:  service_healthy
      vault-init:
        condition:  service_completed_successfully
    networks:
      - trans_net
    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 15s

  timeout_checker:
    build:
      context:      backend
      dockerfile:   timeout_checker/docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/timeout_checker
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/timeout_checker,mode=max
    container_name: trans_timeout_checker
    restart:        unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST:      trans_db_server
      #DB_PORT:      ${DB_PORT}
      DB_PORT:      "5432"
      REDIS_HOST:   trans_redis
      REDIS_PORT:   ${REDIS_PORT}
    depends_on:
      postgres:
        condition:  service_healthy
      redis:
        condition:  service_healthy
    networks:
      - trans_net
     
  # NOTE(local): construit frontend-react/dist dans un conteneur Node 22 (le
  # host tourne en Node 18, trop vieux pour Vite 8) - meme principe que
  # engine-builder. `npm ci` + `npm run build` ecrivent directement dans
  # ./frontend-react/dist (bind-mount), que frontend_nginx sert ensuite. Pas
  # de rebuild auto sur les changements de sources : relancer ce service
  # (`docker compose -f docker-compose-dev.yml up -d --force-recreate frontend_builder`)
  # apres une modif frontend, comme pour engine-builder/chess_engine.
  frontend_builder:
    image:           node:22-alpine
    container_name:  trans_frontend_builder
    working_dir:     /app
    volumes:
      - ./frontend-react:/app
      - frontend_node_modules:/app/node_modules
    command:         sh -c "npm ci --no-audit --no-fund && npm run build"
    networks:
      - trans_net

  frontend_nginx:
    build:
      context:      frontend
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/frontend_nginx
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/frontend_nginx,mode=max
    container_name: trans_frontend_nginx
    restart:        unless-stopped
    ports:
      - "3000:80"
    volumes:
      # NOTE(local): pointe sur frontend-react + conf proxy locale. Ne pas committer.
      - ./frontend-react/dist:/usr/share/nginx/html:ro
      - ./frontend/docker_conf/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/docker-entrypoint.d/91-update-resolver.sh:ro
    depends_on:
      backend_django:
        condition:  service_healthy
      frontend_builder:
        condition:  service_completed_successfully
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - trans_net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 5s

networks:
  trans_net:
    driver: bridge

volumes:
  frontend_node_modules:











