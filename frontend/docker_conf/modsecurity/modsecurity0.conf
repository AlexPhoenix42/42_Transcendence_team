# frontend/docker_conf/modsecurity/modsecurity.conf

# ── Engine ────────────────────────────────────────────────────
# Start in DetectionOnly mode -switch to ON after tuning
SecRuleEngine DetectionOnly

# ── Request body ──────────────────────────────────────────────
SecRequestBodyAccess		On
SecRequestBodyLimit			5242880		# 5 MB is enough for update
SecRequestBodyNoFilesLimit	131072		# 128 KB for non-file fields

# ── Response body ─────────────────────────────────────────────
SecResponseBodyAccess		Off			# not needed, saves CPU

# ── PCRE limits ───────────────────────────────────────────────
SecPcreMatchLimit			1000
SecPcreMatchLimitRecursion	1000

# ── Audit logging ─────────────────────────────────────────────
SecAuditEngine				RelevantOnly		# only log flagged/blocked req
SecAuditLog					/var/log/modsecurity/trans/audit.log
SecAuditLogParts			ABIJDEFHZ
SecAuditLogType				serial

# ── Paranoia level ────────────────────────────────────────────
SecAction		\
	"id:900000,	\
	phase:1,	\
	pass,		\
	t:none,		\
	nolog,		\
	setvar:tx.paranoia_level=1"

# ── Anomaly scoring thresholds ────────────────────────────────
# 5 = OWASP standard default
SecAction		\
	"id:900110,	\
	phase:1,	\
	pass,		\
	t:none,		\
	nolog,		\
	setvar:tx.inbound_anomaly_score_threshold=5,	\
	setvar:tx.outbound_anomaly_score_threshold=4"

