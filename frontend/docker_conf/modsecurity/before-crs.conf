# Allow DELETE and PATCH methods on API endpoints
SecAction \
    "id:900200,\
     phase:1,\
     pass,\
     nolog,\
     setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

# OAuth callbacks — query strings from providers trigger false positives
# This is the standard CRS approach for OAuth endpoints
SecRule REQUEST_URI "@beginsWith /api/auth/" \
    "id:900201,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleEngine=Off"

