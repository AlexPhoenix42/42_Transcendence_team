# frontend/docker_conf/modsecurity/modsecurity-override.conf
#
# This file is loaded AFTER the base modsecurity.conf shipped with
# the image. ModSecurity uses last-directive-wins, so any directive
# here overrides the corresponding one in the base config.
#
# The base config already handles: XML/JSON body processors (rules
# 200000–200001), multipart validation (200002–200004), PCRE error
# flags (200005), argument limits (200007), request body access,
# response body MIME types, temp/data dirs, unicode mapping, cookie
# format, and argument separator.
#
# Only directives that DIFFER from the base defaults go here.
# ───────────────────────────────────────────────────────────────

# ── Rule engine ───────────────────────────────────────────────
# Start in detection mode — switch to "On" once false-positive
# tuning is complete.
#SecRuleEngine				DetectionOnly
SecRuleEngine				On

# ── Request body limits ───────────────────────────────────────
SecRequestBodyLimit			5242880
SecRequestBodyNoFilesLimit	131072
SecRequestBodyLimitAction	Reject
SecRequestBodyJsonDepthLimit 512

# ── Response body ─────────────────────────────────────────────
SecResponseBodyAccess		On
SecResponseBodyLimit		524288
SecResponseBodyLimitAction	ProcessPartial

# ── PCRE hardening ────────────────────────────────────────────
# Keep these low to prevent ReDoS. The base image defaults to
# 100000 which is too permissive.
SecPcreMatchLimit			1000
SecPcreMatchLimitRecursion	1000

# ── Audit logging ─────────────────────────────────────────────
SecAuditEngine				RelevantOnly
SecAuditLogRelevantStatus	"^(?:5|4(?!04))"
SecAuditLogParts			ABIJDEFHZ
SecAuditLogType				Serial
SecAuditLog					/var/log/modsecurity/audit.log

# ── Telemetry ─────────────────────────────────────────────────
SecStatusEngine				On

