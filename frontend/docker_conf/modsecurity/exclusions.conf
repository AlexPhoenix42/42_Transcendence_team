# frontend/docker_conf/modsecurity/exclusions.conf
#
# This file is loaded as RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# i.e. after all CRS rules, so it can disable or adjust any rule.
#
# ── Healthcheck — internal request, no security value ─────────
SecRule REQUEST_URI "@streq /health" \
    "id:1000,\
     phase:1,\
     pass,\
     nolog,\
     noauditlog,\
     ctl:ruleEngine=Off"

