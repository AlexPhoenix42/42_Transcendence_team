# Mirrors nginx-dep.conf: without this the WAF is simply absent in dev, so
# ModSecurity produces no audit log and the ELK pipeline has nothing to ingest.
load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # WAF on, same rule chain as dep (modsecurity.conf + OWASP CRS).
        # The audit log it writes to /var/log/modsecurity/audit.log is the
        # file input of the Logstash pipeline.
        modsecurity              on;
        modsecurity_rules_file   /etc/modsecurity/main.conf;

        root /usr/share/nginx/html;   # ✅ ADD THIS
        index index.html;             # ✅ ADD THIS

        # Healthcheck endpoint – logs nothing
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SPA routing – all requests go to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}






