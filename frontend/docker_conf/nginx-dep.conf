# frontend/docker_conf/nginx-dep.conf

load_module			modules/ngx_http_modsecurity_module.so;
worker_processes	auto;

events {
	worker_connections	1024;
}

http {
	include				/etc/nginx/mime.types;
	default_type		application/octet-stream;
	sendfile			on;
	keepalive_timeout	65;

	log_format main		'$remote_addr - $remote_user [$time_local] "$request" '
						'$status $body_bytes_sent "$http_referer" '
						'"$http_user_agent" "$http_x_forwarded_for"';

	access_log			/var/log/nginx/access.log main;
	error_log			/var/log/nginx/error.log;

	# ── Rate limiting zones ───────────────────────────────────
	limit_req_zone		$binary_remote_addr	zone=api:10m	rate=30r/m;
	limit_req_zone		$binary_remote_addr	zone=auth:10m	rate=5r/m;
	limit_conn_zone		$binary_remote_addr	zone=perip:10m;
	# ──────────────────────────────────────────────────────────


	# ── Redirect HTTP → HTTPS ─────────────────────────────────
	server {
		listen			80;
		server_name		_;
		return			301 https://$host$request_uri;
	}
	# ──────────────────────────────────────────────────────────


	# ── Monitoring: nginx stub_status for the exporter ────────
	# Internal-only, plain HTTP on 8080, NO ModSecurity (the exporter
	# shouldn't be filtered). Locked to the docker network. The
	# nginx-exporter scrapes http://trans_frontend_nginx:8080/stub_status.
	server {
		listen			8080;
		server_name		_;

		location = /stub_status {
			stub_status;
			allow		172.16.0.0/12;		# docker bridge range (trans_net)
			allow		127.0.0.1;
			deny		all;
			access_log	off;
		}

		location / {
			return		404;
		}
	}
	# ──────────────────────────────────────────────────────────


	# ── Main server ───────────────────────────────────────────
	server {
		listen			443 ssl http2;
		listen			[::]:443 ssl http2;
		#http2			on;
		server_name		_;

		# ── TLS ───────────────────────────────────────────────
		ssl_certificate			/vault/certs/nginx-cert.pem;
		ssl_certificate_key		/vault/certs/nginx-key.pem;
		ssl_protocols			TLSv1.2 TLSv1.3;
		ssl_ciphers				HIGH:!aNULL:!MD5;

		# ── ModSecurity ───────────────────────────────────────
		modsecurity				on;
		modsecurity_rules_file	/etc/modsecurity/main.conf;

		# ── Connection limit ──────────────────────────────────
		limit_conn				perip 20;

		# ── Monitoring: runtime DNS resolver ──────────────────
		# Docker's embedded DNS. Needed so the Grafana proxy below can
		# resolve trans_grafana at REQUEST time via a variable, which
		# lets nginx start even when the monitoring stack isn't running
		# (the /grafana/ location just 502s until Grafana is up) instead
		# of refusing to boot the whole frontend.
		resolver				127.0.0.11 valid=30s ipv6=off;

		# ── Security headers ──────────────────────────────────
		add_header X-Frame-Options				"SAMEORIGIN"		always;
		add_header X-Content-Type-Options		"nosniff"			always;
		add_header X-XSS-Protection				"1; mode=block"		always;
		add_header Referrer-Policy				
			"strict-origin-when-cross-origin"						always;
		add_header Strict-Transport-Security	
			"max-age=63072000; includeSubDomains"					always;
		add_header Content-Security-Policy
			"default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; font-src 'self' data:;"
																	always;

		# ── React SPA ─────────────────────────────────────────
		root					/usr/share/nginx/html;
		index					index.html;		

		# ── nginx health check ────────────────────────────────
		location /health {
			access_log			off;
			return				200 "healthy\n";
			add_header			Content-Type text/plain;
		}

		# ── Static asset caching ──────────────────────────────
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
			expires				1y;
			add_header			Cache-Control "public, immutable";
		}

		# ── Token refresh — normal rate limit ─────────────────
		location = /api/auth/refresh/ {
			limit_req			zone=api burst=10 nodelay;
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forward-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── Auth endpoints — strict rate limit ────────────────
		location ~ ^/api/(login|register|auth|password-reset|2fa-reset) {
			limit_req			zone=auth burst=3 nodelay;
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── Django REST API ───────────────────────────────────
		location /api/ {
			limit_req			zone=api burst=10 nodelay;
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── Django admin ──────────────────────────────────────
		location /admin/ {
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── Django health check ───────────────────────────────
		location /healthz/ {
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── allauth OAuth callbacks ───────────────────────────
		location /accounts/ {
			proxy_pass			http://trans_backend_django:9000;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── WebSocket (wss → ws internally) ──────────────────
		location /ws/ {
			proxy_pass			http://trans_backend_django:9000;
			proxy_http_version	1.1;
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			"upgrade";
			proxy_set_header	Host				$host;
			proxy_set_header	X-Forwarded-Proto	$scheme;
			proxy_read_timeout	3600s;
			proxy_send_timeout	3600s;
		}

		# ── Grafana live (websocket) ──────────────────────────
		# Must come before the plain /grafana/ block conceptually; nginx
		# picks the longest-matching prefix, so this handles the live
		# stream and adds the upgrade headers. ^~ stops the static-asset
		# regex above from ever hijacking a request under this path.
		location ^~ /grafana/api/live/ {
			set					$grafana_live trans_grafana;
			proxy_pass			http://$grafana_live:3000$request_uri;
			proxy_http_version	1.1;
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			"upgrade";
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── Grafana reverse proxy ─────────────────────────────
		# ^~ is REQUIRED: Grafana serves its UI assets under
		# /grafana/public/*.js|css|svg|woff, which the "Static asset
		# caching" regex above would otherwise intercept and 404. ^~ on
		# this prefix tells nginx to skip regex locations once matched.
		# No trailing slash / uses $request_uri so the /grafana/ prefix
		# is forwarded intact — that matches GF_SERVER_SERVE_FROM_SUB_PATH.
		location ^~ /grafana/ {
			set					$grafana_upstream trans_grafana;
			proxy_pass			http://$grafana_upstream:3000$request_uri;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
		}

		# ── SPA routing ───────────────────────────────────────
		location / {
			try_files			$uri $uri/ /index.html;
		}

		# ── Block sensitive paths ─────────────────────────────
		location ~ /\. {
			deny all;
		}

		location ~ \.(env|git|sql|bak|sh|bash)$ {
			deny all;
		}

		# ── Never expose Django /metrics at the edge ──────────
		# Prometheus scrapes it internally over trans_net; the public
		# edge should 404 it.
		location = /metrics {
			return 404;
		}
	}
	# ──────────────────────────────────────────────────────────
}

