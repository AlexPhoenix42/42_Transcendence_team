<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man — Connexion</title>
    <style>
        @font-face {
            font-family: 'Press Start 2P';
            src: url('src/fonts/press-start-2p-v9-latin-regular.woff2') format('woff2');
            font-display: swap;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #14142b;
            font-family: 'Press Start 2P', monospace;
            color: #ffe14d;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 420px;
            border: 2px solid #ffe14d; border-radius: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 28px;
        }
        h1 { font-size: 16px; text-align: center; margin-bottom: 6px; }
        .sub { font-size: 9px; color: #9a9ac0; text-align: center; margin-bottom: 24px; line-height: 1.6; }
        button.ft {
            width: 100%; padding: 15px; font: inherit; font-size: 11px;
            background: #00babc; color: #002b2b; border: none; border-radius: 5px;
            cursor: pointer;
        }
        button.ft:hover { background: #00d4d6; }
        .msg { margin-top: 16px; font-size: 9px; line-height: 1.7; min-height: 14px; }
        .msg.error { color: #ff6b6b; }
        .alt { margin-top: 20px; text-align: center; font-size: 9px; }
        .alt a { color: #9a9ac0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🕹️ PAC-MAN</h1>
        <div class="sub">Connecte-toi avec ton compte 42<br>pour garder ton classement</div>

        <button type="button" class="ft" id="ft42">🎓 Se connecter avec 42</button>

        <div class="msg" id="msg"></div>

        <div class="alt">
            <a href="lobby.html">Continuer en invité →</a>
        </div>
    </div>

    <script type="module">
        import { ft42LoginUrl, isLoggedIn, initAuth } from './src/js/net/auth.js';

        const params = new URLSearchParams(location.search);
        const next = params.get('next') || 'lobby.html';
        if (params.get('error')) {
            document.getElementById('msg').className = 'msg error';
            document.getElementById('msg').textContent = 'Connexion 42 refusée. Réessaie.';
        }

        document.getElementById('ft42').addEventListener('click', () => {
            location.href = ft42LoginUrl();
        });

        initAuth().then(() => { if (isLoggedIn()) location.href = next; });
    </script>
</body>
</html>
