# =============================================================================
# Three additions to your existing docker_conf/nginx-dep.conf.
# These are snippets, NOT a full file — paste each block into the place noted.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) stub_status server — INSIDE the `http { ... }` block, as a NEW server{}.
#    The nginx-exporter scrapes this. Port 8080 is internal to the container
#    network only (not published to the host), so keep it locked down.
# -----------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        # Only allow the docker network to read it; deny everything else.
        allow 172.16.0.0/12;   # docker default bridge range
        allow 127.0.0.1;
        deny all;
        access_log off;
    }
}

# -----------------------------------------------------------------------------
# 2) Grafana reverse proxy — INSIDE your main `server { listen 443 ssl ... }`
#    block, alongside your other location blocks. Lets you reach Grafana at
#    https://<host>/grafana/ instead of exposing port 3001 publicly.
#    (Grafana's GF_SERVER_ROOT_URL / SERVE_FROM_SUB_PATH must be set to match —
#    they are, in the compose file.)
# -----------------------------------------------------------------------------
location /grafana/ {
    proxy_pass http://trans_grafana:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Grafana live/websocket (dashboards, alerting UI).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# -----------------------------------------------------------------------------
# 3) Block /metrics from the public edge — INSIDE the same 443 server block.
#    Django's /metrics is scraped internally by Prometheus over trans_net;
#    it should never be reachable from the internet.
# -----------------------------------------------------------------------------
location = /metrics {
    deny all;
    return 404;
}

