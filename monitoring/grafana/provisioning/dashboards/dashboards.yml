apiVersion: 1

providers:
  - name: "Transcendence"
    orgId: 1
    folder: "Transcendence"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # This is the path INSIDE the Grafana container. The compose file
      # mounts monitoring/grafana/dashboards -> /var/lib/grafana/dashboards.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

