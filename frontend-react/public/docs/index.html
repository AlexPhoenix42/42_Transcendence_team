<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .nav { background: #1e293b; padding: 1rem 2rem; display: flex; gap: 1rem; border-bottom: 1px solid #334155; }
        .nav a { color: #94a3b8; text-decoration: none; padding: 0.5rem 1rem; border-radius: 0.375rem; }
        .nav a:hover, .nav a.active { color: #fff; background: #334155; }
        .content { max-width: 900px; margin: 2rem auto; padding: 0 2rem; line-height: 1.7; }
        h1, h2, h3 { color: #f8fafc; margin: 1.5rem 0 0.75rem; }
        h1 { font-size: 2rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; }
        a { color: #60a5fa; }
        code { background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        pre { background: #1e293b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        th, td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #1e293b; }
        ul, ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        blockquote { border-left: 3px solid #3b82f6; padding-left: 1rem; color: #94a3b8; margin: 1rem 0; }
        img { max-width: 100%; }
        .mermaid { background: #1e293b; padding: 1rem; border-radius: 0.5rem; margin: 1rem 0; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="#" onclick="load('README.md')" id="nav-readme">README</a>
        <a href="#" onclick="load('API_DOC.md')" id="nav-api">API Documentation</a>
        <a href="/" style="margin-left:auto">← Back to App</a>
    </div>
    <div class="content" id="content">Loading...</div>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        const renderer = new marked.Renderer();
        const origCode = renderer.code.bind(renderer);
        renderer.code = function({ text, lang }) {
            if (lang === 'mermaid') {
                return `<pre class="mermaid">${text}</pre>`;
            }
            return origCode({ text, lang });
        };
        marked.setOptions({ renderer });

        async function load(file) {
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            const id = file === 'README.md' ? 'nav-readme' : 'nav-api';
            document.getElementById(id).classList.add('active');

            try {
                const resp = await fetch(`/docs/${file}`);
                if (!resp.ok) throw new Error('Not found');
                const md = await resp.text();
                document.getElementById('content').innerHTML = marked.parse(md);
                await mermaid.run({ querySelector: '.mermaid' });
            } catch (e) {
                document.getElementById('content').innerHTML = '<p>Failed to load document.</p>';
            }
        }

        load('README.md');
    </script>
</body>
</html>
