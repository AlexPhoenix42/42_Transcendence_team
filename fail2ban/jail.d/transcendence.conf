# fail2ban/jail.d/transcendence.conf
#
# Jail definitions for Transcendence.
# All jails use the socket-ban action (privilege separation).

[DEFAULT]
# Use our custom socket action — never call iptables directly
banaction = socket-ban

# Ignore internal Docker network (containers talking to each other)
ignoreip  = 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8


# ── Auth brute-force ─────────────────────────────────────────────────────
# Matches: 401/403/429 on /api/login/, /api/register/, /api/password-reset/
# Threshold: 5 failures in 15 minutes → ban for 30 minutes
# Mirrors the app-level lockout (audit module) at the network level
[transcendence-auth]
enabled   = true
filter    = transcendence-auth
logpath   = /var/log/nginx/access.log
maxretry  = 5
findtime  = 900
bantime   = 1800


# ── WAF / rate-limit repeat offenders ────────────────────────────────────
# Matches: repeated 403 (ModSecurity) or 429 (rate limit) on any endpoint
# Threshold: 15 blocks in 5 minutes → ban for 1 hour
# Higher threshold because some 403s can be false positives
[transcendence-waf]
enabled   = true
filter    = transcendence-waf
logpath   = /var/log/nginx/access.log
maxretry  = 15
findtime  = 300
bantime   = 3600

