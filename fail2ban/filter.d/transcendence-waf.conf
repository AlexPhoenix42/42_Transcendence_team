# fail2ban/filter.d/transcendence-waf.conf
#
# Matches IPs that repeatedly trigger ModSecurity/WAF blocks or
# hit rate limits on ANY endpoint (not just auth).
#
# This catches attackers doing SQL injection, XSS, path traversal,
# etc. — things ModSecurity blocks with 403.
#
# We use the Nginx access log (not the ModSecurity audit log) because:
#   - ModSecurity's serial format is hard to parse with fail2ban
#   - Every ModSecurity block shows up as 403 in the Nginx access log
#   - The client IP in the access log is always correct
#
# Examples matched:
#   192.168.1.50 - - [24/Oct/2026:18:00:00 +0000] "GET /api/users/?id=1' OR 1=1 HTTP/1.1" 403 ...
#   10.0.0.1 - - [24/Oct/2026:18:00:05 +0000] "POST /api/game/ HTTP/1.1" 429 ...

[Definition]

datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z

# Match any 403 (WAF block) or 429 (rate limit) on any path
failregex = ^<HOST> .+ ".+" (?:403|429)

# Ignore the auth endpoints — those are handled by transcendence-auth
# jail with stricter thresholds. Also ignore static assets.
ignoreregex = "POST /api/(?:login|register|password-reset|auth|2fa-reset)/
               "GET /health
               "GET /stub_status

