# fail2ban/filter.d/transcendence-auth.conf
#
# Matches failed authentication attempts in the Nginx access log.
#
# Nginx log format (main):
#   $remote_addr - $remote_user [$time_local] "$request" $status ...
#
# What we catch:
#   - 401 on auth endpoints = wrong credentials (Django returned 401)
#   - 403 on auth endpoints = locked account or ModSecurity block
#   - 429 on auth endpoints = rate-limited (nginx limit_req)
#
# Examples matched:
#   192.168.1.50 - - [24/Oct/2026:18:00:00 +0000] "POST /api/login/ HTTP/1.1" 401 ...
#   10.0.0.1 - - [24/Oct/2026:18:00:05 +0000] "POST /api/register/ HTTP/1.1" 403 ...

[Definition]

# datepattern: Nginx uses dd/Mon/yyyy:HH:MM:SS +ZZZZ
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z

# failregex: match failed auth requests
#   <HOST> = the IP fail2ban extracts for banning
#   Auth endpoints: /api/login/, /api/register/, /api/password-reset/, /api/auth/, /api/2fa-reset/
failregex = ^<HOST> .+ "POST /api/(?:login|register|password-reset|auth|2fa-reset)/.* (?:401|403|429)

# ignoreregex: don't match legitimate 403s from other sources
ignoreregex =

