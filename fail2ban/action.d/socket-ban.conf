# fail2ban/action.d/socket-ban.conf
#
# Custom action: sends BAN/UNBAN commands to the firewall-agent via Unix socket.
# fail2ban never touches iptables directly — privilege separation.

[Definition]

# Path to the firewall-agent Unix socket (shared volume)
socket = /var/run/firewall-agent/fw.sock

actionban   = echo "BAN <ip>"   | socat - UNIX-CONNECT:%(socket)s
actionunban = echo "UNBAN <ip>" | socat - UNIX-CONNECT:%(socket)s

# No start/stop actions needed — the firewall-agent manages its own lifecycle
actionstart =
actionstop  =
actioncheck =

