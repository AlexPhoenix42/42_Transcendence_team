services:
  postgres:
    build:
      context:              db_server
      dockerfile:           docker_conf/Dockerfile
      target:               dep
      pull:                 false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/postgres
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/postgres,mode=max
    container_name:         trans_db_server
    restart:                unless-stopped
    depends_on:
      vault:
        condition:          service_healthy
      vault-init:
        condition:          service_completed_successfully
    environment:
      #POSTGRES_USER:       ${DB_SERVER_USER}
      #POSTGRES_PASSWORD:   ${DB_SERVER_PASS}
      POSTGRES_DB:          ${DB_SERVER_DB}
      FRONTEND_URL:         ${FRONTEND_URL}
      VAULT_ADDR:           ${VAULT_URL}
      VAULT_CACERT:         /vault/certs/ca-cert.pem
    ports:
      - "${DB_PORT}:5432"   # The internal port stays hard-coded (internal confs deps)
    volumes:
      - ${HOME}/goinfre/trans_data/trans_db_server_data:/var/lib/postgresql
      - ./vault/certs:/vault/certs:ro
      - ./vault/approle:/vault/approle:ro
    entrypoint: ["/usr/local/bin/vault-entrypoint.sh"]
    command:    ["postgres"]
    networks:
      - trans_net
    healthcheck:
      #test: ["CMD-SHELL", "pg_isready -U ${DB_SERVER_USER} -d ${DB_SERVER_DB}"]
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /dev/shm/vault-postgres-user)\" -d \"${DB_SERVER_DB}\""]
      interval:     5s
      timeout:      5s
      retries:      5
      start_period: 120s

  redis:
    image:            redis:8-alpine
    container_name:   trans_redis
    restart:          unless-stopped
    networks:
      - trans_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  vault-init:
    #image:          hashicorp/vault:latest
    build:
      context:      vault-init
      dockerfile:   Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/vault-init
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/vault-init,mode=max
    depends_on:
      vault:
        #condition:  service_healthy
        condition:  service_started
    #env_file:
      #- ${DECRYPTED_SEC_FILE:-/dev/null}
    environment:
      #VAULT_ADDR:   http://vault:8200
      #VAULT_TOKEN:  root
      VAULT_ADDR:               ${VAULT_URL}
      VAULT_CACERT:             /vault/certs/ca-cert.pem
      SERVER_IP:                ${SERVER_IP}
    volumes:
      #- ./.env:/app/.env:ro
      #- ./vault:/vault
      #- ./vault/certs:/vault/certs:ro
      - ./vault/certs:/vault/certs
      - ./vault/secrets:/vault/secrets
      - ./vault/approle:/vault/approle
      - ${DECRYPTED_SEC_FILE:-/dev/null}:/vault/decrypted-secrets.env:ro

    #  - ./scripts_dev/init_unseal_vault.sh:/app/init_unseal_vault.sh:ro
    #entrypoint:     ["/bin/sh", "-c"]
    #command:
    #  - |
    #    /app/init_unseal_vault.sh
    #    #/app/seed_vault.sh
    restart:        "no"
    networks:
      - trans_net

  vault:
    build:
      context:      vault
      dockerfile:   docker_conf/Dockerfile
      target:       dep
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/vault
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/vault,mode=max
    container_name:             trans_vault
    restart:                    unless-stopped
    environment:
      #VAULT_MODE:               dev
      #VAULT_DEV_ROOT_TOKEN_ID:  root   # dev
      VAULT_MODE:               dep
      VAULT_ADDR:               ${VAULT_URL}
      VAULT_CACERT:             /vault/certs/ca-cert.pem
    ports:
      - "8200:8200"
    volumes:
      - ./vault/certs:/vault/certs:ro
      #- ./vault/config/config-dev.hcl:/vault/config/config.hcl
      - ./vault/config/config-dep.hcl:/vault/config/config.hcl
      #- ./vault/data:/vault/data
      - ${HOME}/goinfre/trans_data/trans_vault_data:/vault/data
    networks:
      - trans_net
    healthcheck:
      #test: ["CMD", "vault", "status"]
      test: ["CMD", "sh", "-c", "VAULT_CACERT=/vault/certs/ca-cert.pem vault status > /dev/null 2>&1"]
      #test: ["CMD", "sh", "-c", "VAULT_CACERT=/vault/certs/ca-cert.pem vault status -format=json | jq -e '.initialized and (.sealed | not)'"]
      #test: ["CMD", "sh", "-c", "VAULT_CACERT=/vault/certs/ca-cert.pem vault status || true"]
      #test: ["CMD", "sh", "-c", "VAULT_CACERT=/vault/certs/ca-cert.pem vault status"]
      #test: ["CMD", "sh", "-c", "VAULT_CACERT=/vault/certs/ca-cert.pem vault status -format=json | jq -e '.initialized and (.sealed | not)'"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 300s

  mailpit:
    image:            axllent/mailpit
    container_name:   mailpit
    restart:          unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP server
    networks:
      - trans_net

  engine-builder:
    build:
      context:      backend/chess_engine
      dockerfile:   docker_conf/Dockerfile
      target:       build
      pull:         false
    container_name: engine-builder
    volumes:
      - ./backend/chess_engine/srcs:/app/srcs:ro
      - ./backend/chess_engine/incs:/app/incs:ro
      - ./backend/chess_engine/Makefile:/app/Makefile:ro
      - ./backend/chess_engine/bin:/app/bin
    command: sh -c "make clean && make"
    networks:
      - trans_net

  chess_engine:
    build:
      context:      backend/chess_engine
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/chess_engine
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/chess_engine,mode=max
    container_name: chess_engine
    restart:        unless-stopped
    environment:
      ENGINE_PORT: 4190
    expose:
      - "4190"
    networks:
      - trans_net

  stockfish_ai:
    build:
      context:      backend/stockfish_ai
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/stockfish_ai
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/stockfish_ai,mode=max
    container_name: stockfish_ai
    restart:        unless-stopped
    environment:
      ENGINE_PORT: 4191
    expose:
      - "4191"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus:           "1.0"
          memory: 512M
          #mem_limit:      512M
          #memswap_limit:  -1
    networks:
      - trans_net

  #django:
  backend_django:
    # dns is used only when .env.dep2 is used on other machine
    #dns:
    #  - 8.8.8.8
    #  - 1.1.1.1
    build:
      context:      backend/django
      dockerfile:   docker_conf/Dockerfile
      #target:       dev
      target:       dep
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/backend_django
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/backend_django,mode=max
    container_name: trans_backend_django
    restart:        unless-stopped
    env_file:
      - .env.dep
      #- ${DECRYPTED_SEC_FILE:-.env}
    environment:
      DB_HOST:      trans_db_server
      DB_PORT:      "5432"
      REDIS_HOST:   trans_redis
      REDIS_PORT:   "6379"
      VAULT_URL:    ${VAULT_URL}
      VAULT_AUTH_METHOD:  approle
      VAULT_CACERT: /vault/certs/ca-cert.pem
      PYTHONUNBUFFERED: "1"
    ports:
      - "9000:9000"
    volumes:
      - ./backend/django:/django
      - ./vault/certs:/vault/certs:ro
      - ./vault/approle:/vault/approle:ro
      #- ${HOME}/goinfre/trans_data/trans_vault_data:/vault/data
    depends_on:
      postgres:
        condition:  service_healthy
      redis:
        condition:  service_healthy
      vault:
        condition:  service_healthy
      vault-init:
        condition:  service_completed_successfully
    networks:
      - trans_net
    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck"]
      interval:     10s
      timeout:      30s
      retries:      5
      start_period: 60s

  timeout_checker:
    build:
      context:      backend
      dockerfile:   timeout_checker/docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/timeout_checker
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/timeout_checker,mode=max
    container_name: trans_timeout_checker
    restart:        unless-stopped
    env_file:
      - .env.dep
      #- ${DECRYPTED_SEC_FILE:-.env}
    environment:
      DB_HOST:      trans_db_server
      #DB_PORT:      ${DB_PORT}
      DB_PORT:      "5432"
      REDIS_HOST:   trans_redis
      REDIS_PORT:   ${REDIS_PORT}
      DB_USER_FILE: /dev/shm/vault-db-user
      DB_PASS_FILE: /dev/shm/vault-db-pass
      VAULT_ADDR:   ${VAULT_URL}
      VAULT_CACERT: /vault/certs/ca-cert.pem
    entrypoint:     ["/usr/local/bin/vault-entrypoint.sh"]
    volumes:
      - ./vault/certs:/vault/certs:ro
      - ./vault/approle:/vault/approle:ro
    depends_on:
      postgres:
        condition:  service_healthy
      redis:
        condition:  service_healthy
      vault:
        condition:  service_healthy
      vault-init:
        condition:  service_completed_successfully
    networks:
      - trans_net
     
  frontend_nginx:
    build:
      context:      frontend
      dockerfile:   docker_conf/Dockerfile
      pull:         false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/frontend_nginx
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/frontend_nginx,mode=max
    container_name: trans_frontend_nginx
    restart:        unless-stopped
    ports:
      #- "3000:80"
      - "443:443"
      - "80:80"
    volumes:
      - ./frontend/logs/modsecurity:/var/log/modsecurity
      #- ./frontend/dist:/usr/share/nginx/html:ro   # this for dep
      - ./frontend-Alex/public:/usr/share/nginx/html:ro  # this for dev
      - ./vault/certs:/vault/certs:ro
      #- ./frontend/docker_conf/nginx.conf:/etc/nginx/nginx.conf:ro
      #- ./frontend/docker_conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend_django:
        condition:  service_healthy
      vault-init:
        condition:  service_completed_successfully
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - trans_net
    healthcheck:
      #test: ["CMD-SHELL", "wget --quiet --tries=1 --spider $${FRONTEND_URL}/health || exit 1"]
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --tries=1 --spider https://127.0.0.1/health || exit 1"]
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 5s

  backup:
    build:
      context:              backup
      dockerfile:           Dockerfile
      pull:                 false
      cache_from:
        - type=local,src=${HOME}/goinfre/trans_cache/backup
      cache_to:
        - type=local,dest=${HOME}/goinfre/trans_cache/backup,mode=max
    container_name:         trans_backup
    restart:                unless-stopped
    environment:
      VAULT_ADDR:           ${VAULT_URL}
      VAULT_CACERT:         /vault/certs/ca-cert.pem
      DB_NAME:              ${DB_SERVER_DB}
      RUN_INITIAL_BACKUP:   "false"
      RESTIC_REPOSITORY:    /backup-repo
      SHELL:                /bin/sh
    volumes:
      - ./vault/certs:/vault/certs:ro
      - ./vault/approle:/vault/approle:ro
      - ${HOME}/goinfre/trans_data/trans_backups/restic-repo:/backup-repo
      - ./backend/django/media:/media:ro
      - ./.env.secrets.enc:/app/.env.secrets.enc:ro
    depends_on:
      postgres:
        condition:  service_healthy
      vault:
        condition:  service_healthy
      vault-init:
        condition:  service_completed_successfully
    networks:
      - trans_net


networks:
  trans_net:
    driver: bridge

